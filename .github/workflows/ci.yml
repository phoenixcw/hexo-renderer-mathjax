name: CI

on:
  push:
    branches: [main]
  pull_request:
  # GitHub disables scheduled runs after 60 days without repository activity,
  # so keep a way to trigger the audit by hand.
  workflow_dispatch:
  schedule:
    # Catch advisories filed against dependencies of an otherwise idle repo.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is EOL but still widely deployed; 22 and 24 are the maintained LTS lines.
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run coverage

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # The plugin ships no production dependencies, so anything here is a regression.
      - run: npm audit --omit=dev --audit-level=low
      # Dev tooling is allowed to lag behind, but not on anything serious.
      - run: npm audit --audit-level=high
